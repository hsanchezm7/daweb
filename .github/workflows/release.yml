name: Crear Release

on:
  push:
    tags:
      - 'v*' # v1.0.0, v2.1.3, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar y compilar el cliente web
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Empaquetar el cliente
        working-directory: ./frontend
        run: zip -r ../swapIt-frontend.zip dist/

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: swapIt-frontend.zip
          generate_release_notes: true
